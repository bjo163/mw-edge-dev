name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm plugins:lock:check
      - run: pnpm test
        env:
          MW_BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-password-123456
      - run: pnpm ui:build
      - run: pnpm build
