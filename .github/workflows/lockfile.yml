name: lockfile

on:
  push:
    branches: [dev]
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mw-edge-repository-mutation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: 11.17.0
      - name: Generate deterministic lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile only when it changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "pnpm-lock.yaml is current"
            exit 0
          fi

          remote_sha="$(git ls-remote origin refs/heads/dev | awk '{print $1}')"
          if [[ "$remote_sha" != "${GITHUB_SHA}" ]]; then
            echo "::error::dev moved from ${GITHUB_SHA} to $remote_sha; refusing stale lockfile write"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh pnpm lockfile"
          git push origin HEAD:dev
