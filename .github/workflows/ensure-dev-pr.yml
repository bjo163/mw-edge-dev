name: ensure-dev-pr
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure dev -> main PR exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$REPO" --state open --base main --head dev --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR #$existing already exists"
          else
            gh pr create --repo "$REPO" --base main --head dev               --title "chore: sync dev into main"               --body "Automated integration PR. dev is the only working branch; main is stable/release."
          fi
