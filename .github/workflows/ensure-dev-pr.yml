name: ensure-dev-pr

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mw-edge-repository-mutation
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile dev to main integration PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev
          state="$(bash .github/scripts/branch-state.sh origin/main origin/dev)"
          echo "branch_state=$state" >> "$GITHUB_STEP_SUMMARY"

          case "$state" in
            CLEAN)
              echo "main and dev are identical; integration PR is not needed."
              exit 0
              ;;
            DEV_AHEAD)
              ;;
            MAIN_AHEAD_RELEASE|DIVERGED|BLOCKED)
              echo "::error::Refusing to create integration PR while branch state is $state"
              exit 1
              ;;
            *)
              echo "::error::Unknown branch state $state"
              exit 1
              ;;
          esac

          existing="$(gh pr list --repo "$REPO" --state open --base main --head dev --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "PR #$existing already exists"
            exit 0
          fi

          if ! gh pr create --repo "$REPO" --base main --head dev \
            --title "chore: sync dev into main" \
            --body "Automated integration PR for the current DEV_AHEAD state." 2>/tmp/pr.err; then
            cat /tmp/pr.err >&2
            echo "::error::Unable to create dev -> main PR. Verify repository Actions permissions."
            exit 1
          fi
