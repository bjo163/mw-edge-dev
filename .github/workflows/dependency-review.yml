name: dependency-review

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect GitHub Dependency Graph availability
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Dependency Graph is unavailable; using the fail-closed package audit fallback."
          fi

      - name: Block vulnerable or disallowed dependency introductions
        if: steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
          vulnerability-check: true
          license-check: true
          show-patched-versions: true

      - name: Set up pnpm fallback
        if: steps.graph.outputs.available != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0

      - name: Set up Node fallback
        if: steps.graph.outputs.available != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Fail closed on moderate-or-higher vulnerabilities
        if: steps.graph.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm audit --audit-level=moderate
