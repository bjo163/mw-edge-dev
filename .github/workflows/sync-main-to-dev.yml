name: sync-main-to-dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mw-edge-repository-mutation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Converge main into dev when safe
        shell: bash
        run: |
          set -euo pipefail
          output="$(bash .github/scripts/sync-main-to-dev.sh)"
          echo "$output"
          echo "$output" >> "$GITHUB_STEP_SUMMARY"
