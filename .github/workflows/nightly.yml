name: nightly

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/nightly.yml"
      - ".github/scripts/nightly-lifecycle.sh"
      - ".github/scripts/quickstart-smoke.sh"
      - ".github/scripts/governance-check.sh"
      - "scripts/migrate.ts"
      - "scripts/factory-reset.ts"
      - "src/server.ts"
      - "pnpm-lock.yaml"
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Fresh frozen install
        run: pnpm install --frozen-lockfile
      - name: Documented Quick Start smoke
        run: bash .github/scripts/quickstart-smoke.sh
      - name: Canonical readiness
        run: pnpm readiness
      - name: Governance drift
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/governance-check.sh
      - name: Full isolated lifecycle
        run: bash .github/scripts/nightly-lifecycle.sh
      - name: Retain lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-lifecycle-${{ github.run_id }}
          path: ${{ runner.temp }}/mw-edge-nightly
          if-no-files-found: warn
          retention-days: 14
